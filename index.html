<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELVET & SILK | Premium Store</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: rgba(22, 22, 29, 0.7);
            --accent-pink: #ff2a74;
            --accent-purple: #8a2be2;
            --gradient: linear-gradient(135deg, #ff2a74 0%, #8a2be2 100%);
            --text-main: #f1f1f5;
            --text-muted: #9a9a9a;
            --border-glow: rgba(255, 42, 116, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* 18+ Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: rgba(25, 25, 35, 0.9);
            border: 1px solid var(--border-glow);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            max-width: 440px;
        }

        .btn {
            padding: 0.8rem 1.8rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 42, 116, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #333;
            margin-left: 10px;
        }

        /* Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 11, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
        }

        .logo span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .bot-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.05);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .bot-link:hover {
            border-color: var(--accent-pink);
        }

        .cart-trigger {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--accent-pink);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* Search & Filters Section */
        .controls-container {
            max-width: 1200px;
            margin: 2rem auto 1rem;
            padding: 0 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            outline: none;
        }

        .price-filter {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }

        .price-filter input {
            width: 100px;
            padding: 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
        }

        /* Catalog Grid */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem 5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--border-glow);
        }

        .card-img-wrap {
            height: 220px;
            background: #1a1a24;
            overflow: hidden;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.05rem;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .add-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .add-btn:hover {
            background: var(--gradient);
        }

        /* Cart & Order Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #13131a;
            z-index: 200;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cart-drawer.open { right: 0; }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.8rem;
            border-radius: 8px;
        }

        .checkout-form {
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkout-form input, .checkout-form textarea {
            width: 100%;
            padding: 0.7rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Verification Modal -->
    <div class="modal-overlay" id="ageModal">
        <div class="modal-card">
            <h2>Вам есть 18 лет?</h2>
            <p style="margin: 1rem 0; color: var(--text-muted);">Подтвердите возраст для входа.</p>
            <button class="btn btn-primary" onclick="confirmAge(true)">Да, есть 18</button>
            <button class="btn btn-secondary" onclick="confirmAge(false)">Нет</button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="nav-container">
            <div class="logo">VELVET<span>&</span>SILK</div>
            <div class="nav-actions">
                <a href="https://t.me/lo18H_bot" target="_blank" class="bot-link">💬 Чат с ботом</a>
                <div class="cart-trigger" onclick="toggleCart()">
                    <span>🛒 Корзина</span>
                    <span class="badge" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Filters & Search -->
    <div class="controls-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск по названию..." oninput="applyFilters()">
        </div>
        <div class="price-filter">
            <span>Цена:</span>
            <input type="number" id="minPrice" placeholder="От" oninput="applyFilters()">
            <input type="number" id="maxPrice" placeholder="До" oninput="applyFilters()">
        </div>
    </div>

    <!-- Main Content -->
    <main class="container">
        <div class="grid" id="catalogGrid"></div>
    </main>

    <!-- Cart Drawer -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Оформление заказа</h3>
            <button style="background:none; border:none; color:#fff; cursor:pointer;" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsList"></div>
        
        <form class="checkout-form" id="orderForm" onsubmit="sendOrder(event)">
            <div style="display:flex; justify-content:space-between; font-weight:bold;">
                <span>Итого:</span>
                <span id="cartTotalSum">0 ₽</span>
            </div>
            <input type="text" id="custName" placeholder="Ваше имя / Псевдоним" required>
            <input type="tel" id="custPhone" placeholder="Телефон / Telegram handle" required>
            <textarea id="custComment" placeholder="Адрес доставки или комментарий" rows="2"></textarea>
            <button type="submit" class="btn btn-primary" style="width:100%;">Отправить заказ</button>
        </form>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8727623250:AAHNoRs1vICs88RgLefTUOQbUd4WxX9G0qM'; 
        const TELEGRAM_CHAT_ID = '7917303098'; 

        const products = [
            { id: 1, title: 'Смарт-стимулятор Pulse Premium', price: 6490, image: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500' },
            { id: 2, title: 'Шелковый комплект белья', price: 4200, image: 'https://images.unsplash.com/photo-1583846783214-7229a91b20ed?w=500' },
            { id: 3, title: 'Массажное масло 150ml', price: 1850, image: 'https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=500' },
            { id: 4, title: 'Вибропуля с ДУ пультом', price: 2990, image: 'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500' },
            { id: 5, title: 'Атласная маска на глаза', price: 1100, image: 'https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=500' }
        ];

        let cart = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('ageConfirmed') === 'true') {
                document.getElementById('ageModal').style.display = 'none';
            }
            renderProducts(products);
        });

        function confirmAge(isAdult) {
            if (isAdult) {
                localStorage.setItem('ageConfirmed', 'true');
                document.getElementById('ageModal').style.display = 'none';
            } else {
                window.location.href = 'https://google.com';
            }
        }

        function renderProducts(items) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = items.map(product => `
                <div class="card">
                    <div class="card-img-wrap"><img src="${product.image}" alt="${product.title}"></div>
                    <div class="card-body">
                        <div class="card-title">${product.title}</div>
                        <div class="card-footer">
                            <span class="price">${product.price.toLocaleString()} ₽</span>
                            <button class="add-btn" onclick="addToCart(${product.id})">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;

            const filtered = products.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(search);
                const matchesPrice = p.price >= minPrice && p.price <= maxPrice;
                return matchesSearch && matchesPrice;
            });

            renderProducts(filtered);
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            const cartList = document.getElementById('cartItemsList');
            
            cartList.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div>
                        <div style="font-size:0.9rem;">${item.title}</div>
                        <div style="color:var(--accent-pink); font-weight:bold;">${item.price.toLocaleString()} ₽</div>
                    </div>
                    <button style="background:none; border:none; color:#ff4757; cursor:pointer;" onclick="removeFromCart(${index})">✕</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotalSum').innerText = total.toLocaleString() + ' ₽';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        async function sendOrder(e) {
            e.preventDefault();
            if (cart.length === 0) return alert('Корзина пуста!');

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const comment = document.getElementById('custComment').value;
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            const itemList = cart.map(i => `- ${i.title} (${i.price} ₽)`).join('\n');
            const message = `🛍 *Новый заказ!*\n\n*Покупатель:* ${name}\n*Контакты:* ${phone}\n*Комментарий:* ${comment || 'Нет'}\n\n*Состав заказа:*\n${itemList}\n\n*Итого:* ${total.toLocaleString()} ₽`;

            try {
                const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (res.ok) {
                    alert('Заказ успешно отправлен!');
                    cart = [];
                    updateCart();
                    document.getElementById('orderForm').reset();
                    toggleCart();
                } else {
                    alert('Ошибка отправки. Проверьте настройки бота.');
                }
            } catch (err) {
                alert('Сетевая ошибка при отправке.');
            }
        }
    </script>
</body>
</html>
